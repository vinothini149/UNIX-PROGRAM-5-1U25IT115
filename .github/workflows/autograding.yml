name: Linux Echo Command Autograding

on:
  push:
  pull_request:

jobs:
  autograding:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Student Repository
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: |
          chmod +x student.sh
          chmod +x tests/test_echo_file.sh

      - name: Run Student Program
        run: ./student.sh

      - name: Display Created File
        run: |
          echo "=========================================="
          echo "Contents of sample.txt"
          echo "=========================================="
          cat sample.txt || true

      - name: Run Test Cases
        run: ./tests/test_echo_file.sh
